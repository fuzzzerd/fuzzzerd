name: Update Profile Metrics

# METRICS_TOKEN: personal access token; no scopes needed for public data.
# GITHUB_TOKEN: supplied by Actions; contents: write allows generated image commits.
# One Classic SVG per topic, using the built-in neutral styling for both modes.
# Existing -light filenames are retained so published cards remain available.
# Large cards fill the README width; introduction includes a two-week contribution strip.
# Introduction shows account age and activity; star-list languages use named lists.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: ${{ matrix.topic }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        topic: [introduction, stats, languages, starlists]

    steps:
      - name: Generate Metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename}"
          user: ${{ github.repository_owner }}
          filename: profile/metrics-${{ matrix.topic }}-light.svg
          template: classic
          config_display: large
          # Extra bottom clearance for Firefox's font/layout differences.
          config_padding: 0, 21 + 9.5%
          # Larger type without changing Classic's shared light/dark palette.
          extras_css: |
            svg, .items-wrapper { font-size: 18px; line-height: 1.3; }
            h1 { font-size: 24px; }
            h2 { font-size: 20px; }
            h3 { font-size: 18px; }
            .starlist > .count, .field.language.details small { font-size: 16px; }
            svg.large .starlist { width: 920px; }
          base: ${{ matrix.topic == 'introduction' && 'header, activity' || matrix.topic == 'stats' && 'community, repositories' || '' }}
          repositories_affiliations: owner
          repositories_forks: no
          # Smaller language queries reduce timeout risk; log diagnostics automatically.
          repositories_batch: ${{ matrix.topic == 'languages' && 25 || 100 }}
          debug: ${{ matrix.topic == 'languages' }}
          plugin_languages: ${{ matrix.topic == 'languages' }}
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_starlists: ${{ matrix.topic == 'starlists' }}
          plugin_starlists_languages: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_languages: 6
          plugin_starlists_limit_repositories: 0
          plugins_errors_fatal: yes
          retries_delay: 60
