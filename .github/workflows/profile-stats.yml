name: Update Profile Metrics

# METRICS_TOKEN: personal access token; no scopes needed for public data.
# GITHUB_TOKEN: supplied by Actions; contents: write allows generated image commits.
# Each topic has its own light/dark SVG. Introduction uses the GitHub bio.
# Languages: owned repositories; star-list languages: up to two named lists.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: ${{ matrix.topic }} (${{ matrix.theme }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialize direct commits so the cards do not compete to update the branch.
      max-parallel: 1
      matrix:
        topic: [introduction, stats, calendar, languages, starlists]
        theme: [light, dark]

    steps:
      - name: Generate Metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename}"
          user: ${{ github.repository_owner }}
          filename: profile/metrics-${{ matrix.topic }}-${{ matrix.theme }}.svg
          template: classic
          base: ${{ matrix.topic == 'stats' && 'header, activity, community, repositories' || '' }}
          repositories_affiliations: owner
          repositories_forks: no
          plugin_introduction: ${{ matrix.topic == 'introduction' }}
          plugin_introduction_title: yes
          plugin_isocalendar: ${{ matrix.topic == 'calendar' }}
          plugin_isocalendar_duration: full-year
          plugin_languages: ${{ matrix.topic == 'languages' }}
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_starlists: ${{ matrix.topic == 'starlists' }}
          plugin_starlists_languages: yes
          plugin_starlists_limit: 2
          plugin_starlists_limit_languages: 6
          plugin_starlists_limit_repositories: 0
          plugins_errors_fatal: yes
          retries_delay: 60
          extras_css: |
            svg { color: ${{ matrix.theme == 'dark' && '#c9d1d9' || '#24292f' }}; }
            h1, h2, h3 { color: ${{ matrix.theme == 'dark' && '#58a6ff' || '#0969da' }}; }
            .field svg { fill: ${{ matrix.theme == 'dark' && '#8b949e' || '#57606a' }}; }
            .field.language.details small, .starlist > .count, footer {
              color: ${{ matrix.theme == 'dark' && '#8b949e' || '#57606a' }};
            }
